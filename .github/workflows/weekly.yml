name: softwatch digest prep
on:
  schedule:
    - cron: "47 7 * * 1"
  workflow_dispatch:
concurrency:
  group: softwatch
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python -m softwatch digest-prep
      - name: Commit digest input
        run: |
          git config user.name "softwatch-bot"
          git config user.email "softwatch-bot@users.noreply.github.com"
          git add data out
          if ! git diff --cached --quiet; then
            git commit -m "softwatch digest input $(date -u +%Y-%m-%d)"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
