name: softwatch monthly review
on:
  schedule:
    - cron: "52 8 9 * *"
  workflow_dispatch:
concurrency:
  group: softwatch
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python -m softwatch review
      - name: Commit review
        run: |
          git config user.name "softwatch-bot"
          git config user.email "softwatch-bot@users.noreply.github.com"
          git add data out
          if ! git diff --cached --quiet; then
            git commit -m "softwatch monthly review $(date -u +%Y-%m)"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
